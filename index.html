<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src ="script.js" defer></script>
</head>
<body>
    <div class="dashboard">

        <aside class="sidebar">
            <h2 class="logo">SpendWise</h2>
            <nav>
                <ul class="nav-list">
                    <li><a href="#" class="active">Dashboard</a></li>
                    <li><a href="#">Expenses</a></li>
                    <li><a href="#">Budgets</a></li>
                    <li><a href="#">Reports</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </nav>
        </aside>

        <header class="header">
            <h1>Dashboard Overview</h1>
            <p class="user">Welcome back, Loise</p>
        </header>

        <main class="content">

            <section class="panel">
                <h2>Monthly Budget</h2>
                <form id="budget-form" class="form-row" novalidate>
                    <input type="number" id="budget-input" min="0" placeholder="Monthly budget (KSh)" aria-label="Monthly budget in shillings">
                    <button type="submit">Set Budget</button>
                </form>
        
                <div class="summary">
                    <p>Budget: <strong id="summary-budget">KSh 0</strong></p>
                    <p>Spent: <strong id="summary-spent">KSh 0</strong></p>
                    <p>Remaining: <strong id="summary-remaining">KSh 0</strong></p>
                    <p>Used: <strong id="summary-percent">0%</strong></p>
                </div>
        
                <p id="status-message" class="status" role="status"></p>
            </section>
        
            <section class="cards" id="cards"></section>
        
            <section class="panel">
                <h2>Add Expense</h2>
                <form id="expense-form" class="form-row" novalidate>
                    <input type="text" id="expense-name" placeholder="Description" aria-label="Expense description">
                    <input type="number" id="expense-amount" min="1" placeholder="Amount (KSh)" aria-label="Expense amount in shillings">
                    <select id="expense-category" aria-label="Expense category"></select>
                    <button type="submit">Add Expense</button>
                </form>
                <p id="form-error" class="error" role="alert"></p>
            </section>
        
            <section class="panel">
                <h2>Expenses</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expense-list"></tbody>
                    </table>
                </div>
                <p id="empty-message">No expenses yet.</p>
            </section>
        
        </main>

    </div>
</body>
</html>
